name: Build and Push Release Image

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS \
          --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and Push Image
        run: |
          TAG=${{ github.ref_name }}
          APP_NAME=lan-dashboard
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$APP_NAME:$TAG

          docker build -t $APP_NAME:$TAG .
          docker tag $APP_NAME:$TAG $IMAGE_URI
          docker push $IMAGE_URI


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout values repo
        uses: actions/checkout@v4
        with:
          repository: VectorTensor/MemeHub-Infra
          token: ${{ secrets.GIT_PAT }}
          path: gitops

      - name: Update image tag in values.yaml
        run: |
          cd gitops/kubernetes/helms/nextjs-service/lan-dashboard
          TAG=${{ needs.build.outputs.image_tag }}
          echo tag: $TAG
          
          # example for Helm values.yaml
          yq e ".image.tag = \"${TAG}\"" -i values.yaml
          echo updated
          yq e '.image.tag' values.yaml
      - name: Commit and push changes
        run: |
          cd gitops/kubernetes/helms/nextjs-service/lan-dashboard
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add values.yaml
          git commit -m "chore: update image tag to ${{ needs.build.outputs.image_tag }}"
          git push


  release:
    needs: [build, deploy ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release with notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ github.ref_name }}
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --verify-tag
